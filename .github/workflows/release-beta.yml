name: Release (Beta)

on:
  workflow_dispatch:

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute beta version
        id: validate
        run: |
          BETA_BASE=$(cat BETA_VERSION | tr -d '[:space:]')
          if ! [[ "$BETA_BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: BETA_VERSION must be X.Y.Z, got '$BETA_BASE'"
            exit 1
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION="${BETA_BASE}-beta.${BUILD_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: macos-26
    strategy:
      matrix:
        arch: [arm64, x86_64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GhosttyKit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/setup.sh
          scripts/setup.sh

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ matrix.arch }}-

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Install create-dmg
        run: npm install --global create-dmg

      - name: Build and package
        run: |
          chmod +x scripts/build-release.sh scripts/create-icns.sh
          scripts/build-release.sh \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.validate.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: build/Muxy-${{ needs.validate.outputs.version }}-${{ matrix.arch }}.dmg
