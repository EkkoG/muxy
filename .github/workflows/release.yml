name: Release

on:
  workflow_dispatch:
    inputs:
      from_beta_tag:
        description: "Beta tag to package as stable (e.g. v0.26.0-beta.42)"
        required: true
        type: string
      version:
        description: "Stable version to package (X.Y.Z)"
        required: true
        type: string

jobs:
  validate:
    runs-on: macos-26
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          BETA_TAG="${{ inputs.from_beta_tag }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version must be in X.Y.Z format"
            exit 1
          fi
          if ! [[ "$BETA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Error: from_beta_tag must look like vX.Y.Z-beta.N"
            exit 1
          fi
          if ! git rev-parse "$BETA_TAG" >/dev/null 2>&1; then
            echo "Error: tag $BETA_TAG not found"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: macos-26
    strategy:
      matrix:
        arch: [arm64, x86_64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.from_beta_tag }}

      - name: Setup GhosttyKit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/setup.sh
          scripts/setup.sh

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ matrix.arch }}-

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Install create-dmg
        run: npm install --global create-dmg

      - name: Build and package
        run: |
          chmod +x scripts/build-release.sh scripts/create-icns.sh
          scripts/build-release.sh \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.validate.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: build/Muxy-${{ needs.validate.outputs.version }}-${{ matrix.arch }}.dmg
